name: Build & Release Mellune

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Universal Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
            echo "storeFile=${{ github.workspace }}/mellune-release.jks" >> keystore.properties
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > "${{ github.workspace }}/mellune-release.jks"
            echo "Keystore successfully configured."
          else
            echo "No KEYSTORE secret found, falling back to default/debug signing."
          fi

      - name: Build Universal Release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease --build-cache --parallel --no-daemon

      - name: Collect Universal Release APK
        run: |
          mkdir -p release-output
          # Accurately copy only the real Mellune launcher APK from build outputs
          find build/outputs/apk/lawnWithQuickstepGithub/release -name "*.apk" -exec cp {} release-output/Mellune-Release.apk \;
          ls -lh release-output/

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellune-Universal-Release-APK
          path: release-output/Mellune-Release.apk
          if-no-files-found: error
