name: Build & Release Mellune

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Universal Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle with Advanced Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Configure Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
            echo "storeFile=${{ github.workspace }}/mellune-release.jks" >> keystore.properties
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > "${{ github.workspace }}/mellune-release.jks"
            echo "Keystore successfully configured."
          else
            echo "No KEYSTORE secret found, falling back to default/debug signing."
          fi

      - name: Build Release APK and Play Bundle
        run: ./gradlew assembleLawnWithQuickstepGithubRelease bundleLawnWithQuickstepPlayRelease --build-cache --parallel --no-daemon

      - name: Collect Universal Release Artifacts
        run: |
          mkdir -p release-output
          find build/outputs/apk/lawnWithQuickstep/github/release -name "*.apk" -exec cp {} release-output/ \; 2>/dev/null || true
          find build/outputs/bundle/lawnWithQuickstepPlayRelease -name "*.aab" -exec cp {} release-output/ \; 2>/dev/null || true
          ls -lh release-output/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mellune-Universal-Release
          path: release-output/*
          if-no-files-found: error
